name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (for example: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build Apple Silicon release
        env:
          TEXFORGE_MARKETING_VERSION: ${{ steps.tag.outputs.version }}
          TEXFORGE_CURRENT_PROJECT_VERSION: ${{ steps.tag.outputs.version }}
          TEXFORGE_ARCHS: arm64
        run: |
          chmod +x build.sh
          ./build.sh Release

      - name: Verify release app
        run: |
          APP="build/Release/TeXForge.app"
          BIN="$APP/Contents/MacOS/TeXForge"

          test -d "$APP"
          codesign --verify --deep "$APP"

          ARCHS="$(lipo -archs "$BIN")"
          echo "Built architectures: $ARCHS"
          test "$ARCHS" = "arm64"

      - name: Package release zip
        id: package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="TeXForge-${TAG}-arm64.zip"

          cd build/Release
          ditto -c -k --sequesterRsrc --keepParent TeXForge.app "$ASSET"

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="build/Release/${{ steps.package.outputs.asset }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --generate-notes
          fi
