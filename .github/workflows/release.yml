name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (for example: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up signing keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend the temp keychain to the user search list while keeping
          # login.keychain so codesign can resolve Apple's intermediate certs.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Stage notary API key
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          echo "NOTARY_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Apple Silicon release
        env:
          TEXFORGE_MARKETING_VERSION: ${{ steps.tag.outputs.version }}
          TEXFORGE_CURRENT_PROJECT_VERSION: ${{ steps.tag.outputs.version }}
          TEXFORGE_ARCHS: arm64
          TEXFORGE_SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          TEXFORGE_NOTARY_API_KEY_PATH: ${{ env.NOTARY_API_KEY_PATH }}
          TEXFORGE_NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          TEXFORGE_NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          chmod +x build.sh
          ./build.sh Release

      - name: Verify release app
        run: |
          APP="build/Release/TeXForge.app"
          BIN="$APP/Contents/MacOS/TeXForge"

          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Timestamp|flags'
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"

          ARCHS="$(lipo -archs "$BIN")"
          echo "Built architectures: $ARCHS"
          test "$ARCHS" = "arm64"

      - name: Package release zip
        id: package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="TeXForge-${TAG}-arm64.zip"

          cd build/Release
          ditto -c -k --sequesterRsrc --keepParent TeXForge.app "$ASSET"

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="build/Release/${{ steps.package.outputs.asset }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
